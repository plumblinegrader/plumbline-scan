[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline-scan"
version = "0.4.1"
description = "Mechanical pre-release checks for Harbor-format tasks. Needs only Docker; the static checks need nothing."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# Only for `plumbline-scan verify` (the Ed25519 signature check on audit records).
verify = ["cryptography>=42"]

[project.scripts]
plumbline-scan = "plumbline_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a working Docker daemon (builds small toy images)"]
